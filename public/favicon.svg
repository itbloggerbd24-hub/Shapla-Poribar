<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer metallic gold ring gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Coin inner disc gradient -->
    <radialGradient id="goldFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </radialGradient>

    <!-- Bevel highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Inner drop shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Shadow & Coin Body -->
  <circle cx="32" cy="33" r="30" fill="#020617" opacity="0.35" />
  <circle cx="32" cy="32" r="30" fill="url(#goldRim)" filter="url(#glow)" />
  
  <!-- Serrated Coin Edge Dots -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#78350f" stroke-width="0.8" stroke-dasharray="1.5 2.5" />
  
  <!-- Inner Coin Surface -->
  <circle cx="32" cy="32" r="26" fill="url(#goldFace)" stroke="#fef08a" stroke-width="1" />

  <!-- Shapla (Water Lily) Flower Emboss in Emerald & Golden Accents -->
  <g transform="translate(32, 33) scale(0.95)" text-anchor="middle">
    <!-- Base Lily Pad / Leaves -->
    <path d="M-18 6 C-12 11, -4 10, 0 8 C4 10, 12 11, 18 6 C12 14, -12 14, -18 6 Z" fill="#047857" opacity="0.9" />
    
    <!-- Outer Petals -->
    <path d="M0 6 C-12 4, -16 -4, -15 -10 C-10 -7, -4 2, 0 6 Z" fill="#10b981" />
    <path d="M0 6 C12 4, 16 -4, 15 -10 C10 -7, 4 2, 0 6 Z" fill="#10b981" />

    <!-- Mid Petals -->
    <path d="M0 6 C-8 1, -11 -9, -9 -15 C-5 -11, -2 0, 0 6 Z" fill="#34d399" />
    <path d="M0 6 C8 1, 11 -9, 9 -15 C5 -11, 2 0, 0 6 Z" fill="#34d399" />

    <!-- Center Blooming Petal -->
    <path d="M0 6 C-4 -2, -5 -13, 0 -19 C5 -13, 4 -2, 0 6 Z" fill="#6ee7b7" stroke="#ffffff" stroke-width="0.75" />

    <!-- Central Pollen Glow -->
    <circle cx="0" cy="1" r="2.2" fill="#fbbf24" stroke="#ffffff" stroke-width="0.5" />
  </g>

  <!-- Top Curved Specular Glint -->
  <path d="M12 20 A 24 24 0 0 1 52 20 A 22 22 0 0 0 12 20 Z" fill="url(#shine)" opacity="0.6" />

  <!-- Tiny Sparkle Star Top Right -->
  <path d="M48 12 L49 15 L52 16 L49 17 L48 20 L47 17 L44 16 L47 15 Z" fill="#ffffff" opacity="0.9" />
</svg>
